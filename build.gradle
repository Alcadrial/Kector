plugins {
	id("java-library")
	id("maven-publish")
}

var name = "Kector"
group = "com.alcadrial.kector"
base {
	archivesName = "$name-$version"
}

java {
	toolchain.languageVersion.set(JavaLanguageVersion.of(17))
	withSourcesJar()
	withJavadocJar()
}

javadoc {
	configure(options) {
		tags("apiNote:a:Api Note:", "implSpec:a:Impl Spec:", "implNote:a:Impl Note:")
	}
	options.addStringOption('Xdoclint:none', '-quiet')
}

repositories {
	flatDir {
		dirs("libs")
	}
	
	maven {
		name = "Local Maven"
		url = "D:/maven"
	}
	mavenCentral()
}

dependencies {
	
	implementation("org.jspecify:jspecify:1.0.0")
	testImplementation("org.junit.jupiter:junit-jupiter:5.10.0")
	testRuntimeOnly("org.junit.platform:junit-platform-launcher")
}

sourceSets {
	gen {
		java {
			
		}
	}
	out {
		java {
			
		}
	}
}

tasks.compileJava {
	source sourceSets.out.java
}

tasks.sourcesJar {
	from sourceSets.out.java
}

tasks.javadoc {
	source sourceSets.out.java
}

jar.manifest.attributes([
	"Specification-Title" : name,
	"Specification-Version" : version,
	"Specification-Vendor" : "Alcadrial",
	"Implementation-Title" : name,
	"Implementation-Version" : version,
	"Implementation-Vendor" : "Alcadrial"
])

test {
	useJUnitPlatform()
}

publishing {
	publications {
		mavenJava(MavenPublication) {
			artifact jar
			artifact sourcesJar
			artifact javadocJar
		}
	}
	repositories {
		maven {
			url = "D:/maven"
		}
	}
}
