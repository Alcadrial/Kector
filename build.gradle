plugins {
    id("java-library")
    id("maven-publish")
}

group = "com.alcadrial.kector"
base {
	archivesName = "Kector-${version}"
}

ext.name = "Kector"

java {
	toolchain.languageVersion.set(JavaLanguageVersion.of(17))
    withSourcesJar()
    withJavadocJar()
}

javadoc {
    configure(options) {
        tags("apiNote:a:Api Note:", "implSpec:a:Impl Spec:", "implNote:a:Impl Note:")
        header = '<script type="text/javascript" src="http://cdn.mathjax.org/mathjax/latest/MathJax.js?config=TeX-AMS-MML_HTMLorMML"></script>';
    }
	//failOnError = false
	options.addStringOption('Xdoclint:none', '-quiet')
}

tasks.sourcesJar {
    duplicatesStrategy = "exclude"
}

tasks.javadoc {
    options.addBooleanOption("-allow-script-in-comments", true)
}

repositories {
	flatDir {
		dirs("libs")
	}
	
    maven {
    	name = "Local Maven"
    	url = "D:/maven"
    }
    mavenCentral()
}

jar.manifest.attributes([
	"Specification-Title"     : name,
	"Specification-Version"   : version,
	"Specification-Vendor"    : "Alcadrial",
	"Implementation-Title"    : name,
	"Implementation-Version"  : version,
	"Implementation-Vendor"   : "Alcadrial"
])

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifact jar
            artifact sourcesJar
            artifact javadocJar
        }
    }
    repositories {
        maven {
            url = "D:/maven"
        }
    }
}
